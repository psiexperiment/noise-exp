[project]
name = "noise-exp"
description = "Noise exposure using psiexperiment"
readme = "readme.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
authors = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
]
maintainers = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
]
dependencies = [
    # 0.5.0 sets the FIR noise's level from its filter and has
    # `legacy_level`.
    "psiaudio >= 0.5.1",
    # 0.9.7 has `Parameter.field_width` (the exposure's duration field);
    # 0.9.6 the token's `legacy_level` setting.
    "psiexperiment >= 0.9.8",
    # The launcher and the paradigm both build on cftscal: the launcher
    # picks the microphone/speaker calibrations, and the paradigm loads
    # them via `cftscal.paradigms.objects`.
    "cftscal",
    # 0.0.8 is the first release with the psiexperiment plugin
    # (`psivideo.plugin`) that records the video to the exposure folder.
    "psivideo[psi] >= 0.0.8",
]
dynamic = ["version"]

[project.optional-dependencies]
ni = ["pydaqmx"]
tdt = ["tdtpy >=0.10.4"]
soundcard = ["sounddevice", "rtmixer"]
docs = ["sphinx", "sphinx_rtd_theme", "pygments-enaml"]
test = ["pytest", "pytest-console-scripts", "matplotlib"] # Matplotlib is used in some of the validation scripts.
zarr-backend = ["zarr"]
dev = ["coloredlogs"]

[project.scripts]
noise-exp = "noise_exp.main:main"

[project.entry-points."psi.settings"]
# Lets psi-config (and anything else built on psi) see this
# package's settings without importing the package itself.
noise_exp = "noise_exp.config_defaults:DEFAULTS"

[tool.setuptools.package-data]
noise_exp = [
    "icons/*.ico",
    "icons/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.2", "wheel", "setuptools_scm[toml]>=3.4.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/noise_exp/version.py"
