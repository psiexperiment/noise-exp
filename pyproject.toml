[project]
name = "noise-exp"
description = "Noise exposure using psiexperiment"
readme = "readme.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
authors = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
]
maintainers = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
]
dependencies = [
    "psiaudio >= 0.4.4",
    # 0.7.0 is the refactored psiexperiment (see its MIGRATION.md).
    "psiexperiment >= 0.7.0",
    # The launcher and the paradigm both build on cftscal: the launcher
    # picks the microphone/speaker calibrations, and the paradigm loads
    # them via `cftscal.paradigms.objects`.
    "cftscal",
    # set_app_id, so the launcher gets its own taskbar button rather than
    # sharing the interpreter's with the experiments it spawns.
    "psiapp >= 0.0.7",
]
dynamic = ["version"]

[project.optional-dependencies]
ni = ["pydaqmx"]
tdt = ["tdtpy >=0.10.4"]
soundcard = ["sounddevice", "rtmixer"]
docs = ["sphinx", "sphinx_rtd_theme", "pygments-enaml"]
test = ["pytest", "pytest-console-scripts", "matplotlib"] # Matplotlib is used in some of the validation scripts.
zarr-backend = ["zarr"]
dev = ["coloredlogs"]

[project.scripts]
noise-exp = "noise_exp.main:main"

[tool.setuptools.package-data]
noise_exp = [
    "icons/*.ico",
    "icons/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.2", "wheel", "setuptools_scm[toml]>=3.4.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "noise_exp/version.py"
