name: Run tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # No display on the runners. The tests run the paradigm on a null IO
      # manifest, which needs the Qt application but shows no windows.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # sounddevice's Linux wheel, unlike the Windows one, doesn't include
      # PortAudio.
      - name: Install the libraries Qt and sounddevice need (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2

      # noise-exp is developed against the main branches of the packages it
      # is built on (e.g., the golden exposure needs psiexperiment to record
      # fixed token values in the context). Installing them first means
      # installing noise-exp below finds them already satisfied.
      - name: Install psiexperiment and cftscal from main
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psiexperiment[soundcard,zarr] @ git+https://github.com/psiexperiment/psiexperiment.git@main"
          python -m pip install "cftscal @ git+https://github.com/psiexperiment/cftscal.git@main"

      # Nothing names a Qt binding: enaml and qtpy leave the choice to the
      # user. PySide6 is the one used in development (as in cftscal's tests).
      - name: Install noise-exp and its test dependencies
        run: python -m pip install PySide6 -e ".[test]"

      - name: Show the packages being tested against
        run: python -m pip show psiexperiment cftscal psivideo

      # The hardware tests (tests/hardware, run with --fireface) are skipped:
      # they need the Fireface looped back on itself.
      - name: Run tests
        run: python -m pytest
